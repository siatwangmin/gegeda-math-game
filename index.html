<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椰子和可乐的游戏小屋</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            display: flex;
            flex-direction: column;
            background: #FFF9EF;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            padding: 14px 10px 10px;
            background: #FFF9EF;
        }

        header h1 {
            font-size: clamp(19px, 4.6vw, 30px);
            font-weight: 900;
            color: #4A3728;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 4px;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 700;
            color: #A08A6E;
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
            width: 100%;
        }

        /* ===== 两层切换 ===== */
        .layer { display: none; flex: 1; min-width: 0; min-height: 0; }
        .layer.active { display: flex; animation: fadeIn .28s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        #role-layer.active { flex-direction: row; }

        #games-layer.active {
            flex-direction: column;
            overflow-y: auto;
            align-items: center;
        }
        #games-layer.yezi-bg { background: linear-gradient(180deg, #FFF6D8 0%, #FFE7A3 100%); }
        #games-layer.kele-bg { background: linear-gradient(180deg, #EAF3FF 0%, #CFE3FF 100%); }

        .panel {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px 18px;
            border: 0;
            cursor: pointer;
            font: inherit;
            -webkit-appearance: none;
            appearance: none;
            transition: filter .15s;
        }

        .panel:active { filter: brightness(.96); }
        .panel.kele { border-left: 6px solid #FFF9EF; }

        /* ===== 椰子面板（农场暖色）===== */
        .panel.yezi { background: linear-gradient(180deg, #FFF6D8 0%, #FFE7A3 100%); }
        .panel.yezi .who { color: #7A4A12; }
        .panel.yezi .game-name { color: #5D3A1A; }
        .panel.yezi .go { background: #F59E0B; }

        /* ===== 可乐面板（高铁蓝白 + 可乐红）===== */
        .panel.kele { background: linear-gradient(180deg, #EAF3FF 0%, #CFE3FF 100%); }
        .panel.kele::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(115deg, rgba(255,255,255,.4) 0 14px, transparent 14px 46px);
            pointer-events: none;
        }
        .panel.kele .who { color: #1D4ED8; }
        .panel.kele .game-name { color: #173A7A; }
        .panel.kele .go { background: #DC2626; }

        .scene {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero { width: min(56%, 200px); height: auto; position: relative; z-index: 2; }

        /* 椰子面板：草地 + 母鸡 + 蛋 */
        .grass {
            position: absolute;
            bottom: -34px; left: -10%;
            width: 120%; height: 74px;
            background: #8CC152;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            z-index: 1;
        }
        .deco-hen {
            position: absolute;
            right: 4%; bottom: 6%;
            width: min(30%, 92px);
            z-index: 3;
        }

        /* 可乐面板：高铁 */
        .deco-train {
            position: absolute;
            left: 2%; right: 2%; bottom: 4%;
            width: 96%;
            z-index: 3;
        }

        .who {
            position: relative; z-index: 2;
            margin-top: 6px;
            font-size: clamp(24px, 7vw, 44px);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .game-name {
            position: relative; z-index: 2;
            margin-top: 2px;
            font-size: clamp(13px, 3.6vw, 19px);
            font-weight: 700;
            text-align: center;
        }

        .go {
            position: relative; z-index: 2;
            margin-top: 10px;
            display: inline-block;
            padding: 9px 24px;
            border-radius: 999px;
            color: #fff;
            font-size: clamp(13px, 3.6vw, 17px);
            font-weight: 900;
            box-shadow: 0 6px 0 rgba(0, 0, 0, .16);
            transition: transform .12s, box-shadow .12s;
        }

        .panel:active .go { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .16); }

        @media (hover: hover) {
            .panel:hover { filter: brightness(1.02); }
            .panel:hover .go { transform: scale(1.05); }
        }

        /* ===== 第二层：游戏架 ===== */
        .games-inner {
            width: 100%;
            max-width: 560px;
            padding: 14px 16px 30px;
            display: flex;
            flex-direction: column;
        }

        .back {
            align-self: flex-start;
            border: 0;
            cursor: pointer;
            background: rgba(255, 255, 255, .8);
            border-radius: 999px;
            padding: 8px 18px;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            color: #4A3728;
            box-shadow: 0 3px 0 rgba(0, 0, 0, .1);
            transition: transform .12s;
        }
        .back:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .1); }

        .games-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        .avatar-wrap {
            width: 54px; height: 54px;
            flex: none;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 rgba(0, 0, 0, .08);
        }
        .avatar-wrap svg { width: 42px; height: 42px; display: block; }

        .games-title {
            font-size: clamp(21px, 5.4vw, 28px);
            font-weight: 900;
            letter-spacing: 1px;
        }
        #games-layer.yezi-bg .games-title { color: #7A4A12; }
        #games-layer.kele-bg .games-title { color: #1D4ED8; }

        .games-sub {
            margin-top: 2px;
            font-size: clamp(12px, 3.2vw, 14px);
            font-weight: 700;
            color: #8A7A64;
        }

        .game-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff;
            border-radius: 18px;
            padding: 14px;
            margin-top: 14px;
            text-decoration: none;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .08);
            transition: transform .12s, box-shadow .12s;
            animation: cardIn .32s ease backwards;
        }
        .game-card:nth-child(2) { animation-delay: .08s; }
        .game-card:nth-child(3) { animation-delay: .16s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }

        .game-card:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .08); }
        @media (hover: hover) {
            .game-card:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0, 0, 0, .08); }
        }

        .g-icon { width: 64px; height: 64px; flex: none; }
        .g-icon svg { width: 100%; height: 100%; display: block; }

        .g-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .g-title {
            font-size: clamp(16px, 4.2vw, 19px);
            font-weight: 900;
            color: #3A2A18;
        }
        .g-desc {
            margin-top: 3px;
            font-size: clamp(12px, 3.2vw, 14px);
            font-weight: 600;
            color: #8A7A64;
        }

        .g-arrow { width: 22px; height: 22px; flex: none; color: #C9BFAE; }
        .g-arrow svg { width: 100%; height: 100%; display: block; }

        /* ===== 动画 ===== */
        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .coconut { transform-origin: 50% 88%; animation: sway 3.2s ease-in-out infinite; }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .cola-can { animation: bob 2.4s ease-in-out infinite; }

        @keyframes rise {
            0% { transform: translateY(0); opacity: .8; }
            100% { transform: translateY(-34px); opacity: 0; }
        }
        .bub { animation: rise 2.2s linear infinite; }
        .bub.b2 { animation-delay: .7s; }
        .bub.b3 { animation-delay: 1.4s; }

        @keyframes henBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .deco-hen { animation: henBob 1.6s ease-in-out infinite; }

        @keyframes trainRide {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .deco-train { animation: trainRide .4s ease-in-out infinite; }

        @keyframes zoomOut {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-26px); opacity: 0; }
        }
        .zoomline { animation: zoomOut .5s linear infinite; }
        .zoomline.z2 { animation-delay: .17s; }
        .zoomline.z3 { animation-delay: .34s; }
    </style>
</head>

            moto: '<svg viewBox="0 0 64 64" aria-hidden="true">'

               + '<rect x="4" y="24" width="8" height="3.5" rx="1.75" fill="#F2A6A6"/>'
               + '<circle cx="17" cy="45" r="9" fill="#2B2B2B"/>'
               + '<circle cx="17" cy="45" r="3.5" fill="#E8E8E8"/>'
               + '<circle cx="47" cy="45" r="9" fill="#2B2B2B"/>'
               + '<circle cx="47" cy="45" r="3.5" fill="#E8E8E8"/>'
               + '<path d="M17 45 Q20 36 28 33 L38 33 L47 45" stroke="#DC2626" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
               + '<path d="M47 45 L43 30 L48 25" stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
               + '<rect x="24" y="28" width="12" height="5" rx="2.5" fill="#5A2A2A"/>'
               + '</svg>'
        };

        // 第二层标题旁的小头像
        const AVATARS = {
            yezi: '<svg viewBox="0 0 48 48" aria-hidden="true">'
               + '<path d="M23 11 C20 5 13 4 10 7 C15 9 19 10 23 12 Z" fill="#57B84A"/>'
               + '<path d="M25 11 C28 5 35 4 38 7 C33 9 29 10 25 12 Z" fill="#3E9E3A"/>'
               + '<circle cx="24" cy="29" r="16" fill="#8B5A2B"/>'
               + '<ellipse cx="18" cy="28" rx="4" ry="5" fill="#FFFFFF"/>'
               + '<ellipse cx="30" cy="28" rx="4" ry="5" fill="#FFFFFF"/>'
               + '<circle cx="19" cy="29" r="2" fill="#2B1B08"/>'
               + '<circle cx="29" cy="29" r="2" fill="#2B1B08"/>'
               + '<path d="M18 36 Q24 41 30 36" stroke="#2B1B08" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
               + '</svg>',
            kele: '<svg viewBox="0 0 48 48" aria-hidden="true">'
               + '<path d="M14 13 h20 v25 q0 5 -4.5 5 h-11 q-4.5 0 -4.5 -5 z" fill="#DC2626"/>'
               + '<ellipse cx="24" cy="12" rx="11" ry="4" fill="#D9DDE2"/>'
               + '<path d="M14 23 Q24 19 34 23 L34 29 Q24 25 14 29 Z" fill="#FFFFFF" opacity=".95"/>'
               + '<circle cx="24" cy="35" r="7" fill="#FFF6E8"/>'
               + '<circle cx="21.5" cy="34" r="1.3" fill="#5A3A1A"/>'
               + '<circle cx="26.5" cy="34" r="1.3" fill="#5A3A1A"/>'
               + '<path d="M21 37 Q24 40 27 37" stroke="#5A3A1A" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
               + '</svg>'
        };

        const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true">'
                    + '<path d="M9 5 L16 12 L9 19" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
                    + '</svg>';

        const roleLayer = document.getElementById('role-layer');
        const gamesLayer = document.getElementById('games-layer');
        const gamesAvatar = document.getElementById('games-avatar');
        const gamesTitle = document.getElementById('games-title');
        const gamesSub = document.getElementById('games-sub');
        const gamesList = document.getElementById('games-list');

        function openGames(role) {
            const data = GAMES[role];
            gamesLayer.className = 'layer active ' + role + '-bg';
            gamesAvatar.innerHTML = AVATARS[role];
            gamesTitle.textContent = data.name;
            gamesSub.textContent = data.sub;
            gamesList.innerHTML = data.list.map(function (g) {
                return '<a class="game-card" href="' + g.url + '">'
                     + '<span class="g-icon">' + ICONS[g.icon] + '</span>'
                     + '<span class="g-text"><span class="g-title">' + g.title + '</span>'
                     + '<span class="g-desc">' + g.desc + '</span></span>'
                     + '<span class="g-arrow">' + ARROW + '</span>'
                     + '</a>';
            }).join('');
            roleLayer.classList.remove('active');
            window.scrollTo(0, 0);
        }

        function backToRoles() {
            gamesLayer.classList.remove('active');
            roleLayer.classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
